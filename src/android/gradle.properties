# The Bridge app is a normal AndroidX application.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin 2.x compiles the Compose sources through the Compose compiler plugin.
kotlin.code.style=official

org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# No configuration cache: it interacts badly with some Android test tasks, and the build is small.
org.gradle.configuration-cache=false
