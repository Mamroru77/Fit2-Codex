# Gradle 9.7.1 is the current stable release and is what the Android Gradle Plugin 9.4.1 the CI
# report resolved requires. The distribution checksum is Gradle's own published value, so a
# tampered or truncated download is rejected rather than executed.
#
# The wrapper JAR committed beside this file is byte-identical to the one Gradle publishes for
# 9.7.1: SHA-256 7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d
# (https://services.gradle.org/distributions/gradle-9.7.1-wrapper.jar.sha256).
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
distributionSha256Sum=acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a
networkTimeout=10000
retries=3
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
