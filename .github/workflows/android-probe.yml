name: Android toolchain probe

# Answers one question before any Android code is written: can a GitHub-hosted runner reach the
# Android SDK and Google Maven? The development machine cannot - dl.google.com and maven.google.com
# both fail through its proxy - so the Android stages depend on the answer.
#
# This workflow is infrastructure only. It does not build the app.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-probe.yml'

jobs:
  probe:
    name: Reach the Android SDK and Google Maven
    runs-on: ubuntu-latest

    steps:
      - name: Report the toolchain versions
        run: |
          echo "### Toolchain"
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"

      - name: Probe the Android SDK repository
        id: sdk
        run: |
          url="https://dl.google.com/android/repository/repository2-3.xml"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$url" || echo "000")
          echo "dl.google.com/android/repository -> HTTP $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          test "$code" = "200"

      - name: Probe Google Maven (Android Gradle Plugin)
        id: agp
        run: |
          url="https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.5.2/gradle-8.5.2.pom"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$url" || echo "000")
          echo "Google Maven AGP -> HTTP $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          test "$code" = "200"

      - name: Probe Google Maven (AndroidX, the Compose/Room/WorkManager line)
        id: androidx
        run: |
          url="https://dl.google.com/dl/android/maven2/androidx/core/core-ktx/1.13.1/core-ktx-1.13.1.pom"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$url" || echo "000")
          echo "Google Maven androidx -> HTTP $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          test "$code" = "200"

      - name: Probe Maven Central
        id: central
        run: |
          url="https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.0.21/kotlin-stdlib-2.0.21.pom"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$url" || echo "000")
          echo "Maven Central kotlin-stdlib -> HTTP $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          test "$code" = "200"

      - name: Install the Android SDK
        id: install
        uses: android-actions/setup-android@v3

      - name: Confirm the SDK is usable
        id: usable
        run: |
          sdkmanager --version
          sdkmanager --list_installed | head -20
          echo "sdkmanager is present and can list packages"

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Android toolchain probe"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| dl.google.com/android/repository | ${{ steps.sdk.outcome }} (HTTP ${{ steps.sdk.outputs.code }}) |"
            echo "| Google Maven AGP | ${{ steps.agp.outcome }} (HTTP ${{ steps.agp.outputs.code }}) |"
            echo "| Google Maven AndroidX | ${{ steps.androidx.outcome }} (HTTP ${{ steps.androidx.outputs.code }}) |"
            echo "| Maven Central | ${{ steps.central.outcome }} (HTTP ${{ steps.central.outputs.code }}) |"
            echo "| setup-android | ${{ steps.install.outcome }} |"
            echo "| sdkmanager usable | ${{ steps.usable.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
