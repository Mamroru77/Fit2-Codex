name: Android

# The Android verification gate. The development machine cannot reach dl.google.com or
# maven.google.com, so a GitHub-hosted runner is the environment where Stage C and Stage D are built
# and verified. The runner already has the Android SDK preinstalled, so no setup action is needed —
# and `android-actions/setup-android@v3` is deliberately not used, because it tries to install the
# `tools` package, which no longer exists in the SDK repository and makes it fail.
#
# Two jobs, because they fail for different reasons and a reader needs to know which:
#
#   verify        - compiles everything, runs the JVM tests, lints, and assembles the APK.
#   instrumentation - boots a real emulator and runs connectedDebugAndroidTest. It is the only place
#                     the runtime gates run, and it is kept separate so a broken emulator image never
#                     makes the build look broken.
#
# Both use official SDK tooling — sdkmanager, avdmanager, emulator, adb — rather than a third-party
# emulator action, so the emulator is exactly the one the SDK ships and there is nothing to pin.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - 'src/android/**'
  pull_request:
    paths:
      - 'src/android/**'

jobs:
  verify:
    name: Android toolchain and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # The first run downloads the whole dependency graph. Caching it makes every later run a
      # build rather than a download, which matters because this job is the only place the Android
      # app is ever compiled.
      - name: Set up Gradle with dependency caching
        uses: gradle/actions/setup-gradle@v4

      - name: Report the toolchain versions
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"

      - name: Probe the Android SDK repository
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 \
            "https://dl.google.com/android/repository/repository2-3.xml" || echo "000")
          echo "dl.google.com/android/repository -> HTTP $code"
          test "$code" = "200"

      - name: Put the SDK command-line tools on PATH
        run: |
          # The runner has the SDK, but sdkmanager is not on PATH. Resolve it rather than hard-coding a
          # version directory, which changes with the runner image. sdkmanager lives at
          # cmdline-tools/<version>/bin/sdkmanager, so the search has to go three levels deep.
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$(find "$sdk" -maxdepth 5 -name sdkmanager 2>/dev/null | head -1)"

          if [ -z "$sdkmanager_path" ]; then
            echo "::error::No sdkmanager under $sdk"
            ls -la "$sdk" || true
            find "$sdk" -maxdepth 4 -name 'sdkmanager*' || true
            exit 1
          fi

          tools_dir="$(dirname "$sdkmanager_path")"
          echo "Using $sdkmanager_path"

          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$tools_dir" >> "$GITHUB_PATH"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Confirm the preinstalled SDK is usable
        run: |
          sdkmanager --version
          sdkmanager --list_installed | head -40

      - name: Accept the SDK licences and install the build platform
        run: |
          yes | sdkmanager --licenses > /dev/null

          # The package is named platforms;android-37.0, not android-37: API 37 ships as a minor
          # release. Installing the exact package the build asks for avoids a resolver surprise.
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          sdkmanager --list_installed | grep -E 'platforms;android-37|build-tools;37.0.0'

      - name: Note whether the Android project exists yet
        id: project
        run: |
          if [ -f src/android/settings.gradle.kts ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "src/android does not exist yet; the toolchain check above is the whole gate for now."
          fi

      - name: Unit tests, lint, assemble, and compile the instrumentation tests
        if: steps.project.outputs.exists == 'true'
        working-directory: src/android
        run: |
          chmod +x ./gradlew

          # assembleDebugAndroidTest is here as well as in the emulator job: compiling the
          # instrumentation sources is cheap, and a compile error in them should not have to wait for
          # an emulator boot to be discovered.
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest

      - name: Publish the build, test and lint reports
        if: always() && steps.project.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          if-no-files-found: ignore
          # The APK, the human-readable lint report, and the raw JUnit XML. The XML matters because
          # it is the only machine-readable record of which tests ran and what they asserted; without
          # it the artifact proves the build succeeded but not what was verified.
          path: |
            src/android/app/build/reports/**
            src/android/app/build/outputs/apk/**
            src/android/app/build/test-results/**

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Android build"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| src/android present | ${{ steps.project.outputs.exists }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  instrumentation:
    name: Android runtime gates on an emulator
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Gradle with dependency caching
        uses: gradle/actions/setup-gradle@v4

      - name: Put the SDK tools on PATH
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$(find "$sdk" -maxdepth 5 -name sdkmanager 2>/dev/null | head -1)"
          tools_dir="$(dirname "$sdkmanager_path")"

          # `avdmanager` honours ANDROID_USER_HOME and XDG_CONFIG_HOME, and on this runner that put
          # the AVD under $HOME/.config/.android/avd — while the emulator only looks in
          # $ANDROID_AVD_HOME and $HOME/.android/avd. Pinning both to one directory is what stops
          # them disagreeing, which is exactly how the first attempt failed with "Unknown AVD name".
          avd_home="$HOME/.android/avd"
          mkdir -p "$avd_home"

          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$avd_home" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          echo "$tools_dir" >> "$GITHUB_PATH"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk/emulator" >> "$GITHUB_PATH"

      - name: Enable hardware acceleration
        run: |
          # The hosted Linux runners expose KVM; the emulator is unusable without it.
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is missing, so no emulator can run here."
            exit 1
          fi

          sudo chmod 666 /dev/kvm
          ls -la /dev/kvm

      - name: Install the newest usable system image
        id: image
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "emulator" "platforms;android-37.0" "build-tools;37.0.0"

          # API 37 is preferred, but only if the runner's SDK repository actually offers an image for
          # it. The selection is made from `sdkmanager --list` rather than assumed, and the chosen
          # API is printed and recorded, so nothing here claims a version that was not used.
          image="$(sdkmanager --list 2>/dev/null \
            | grep -oE 'system-images;android-[0-9]+;google_apis;x86_64' \
            | sort -u \
            | awk -F';' '{ split($2, a, "-"); if (a[2] + 0 <= 37) print (a[2] + 0) "\t" $0 }' \
            | sort -n -k1,1 \
            | tail -1 \
            | cut -f2)"

          if [ -z "$image" ]; then
            echo "::error::No x86_64 Google APIs system image at or below API 37 is available."
            echo "Available system images:"
            sdkmanager --list 2>/dev/null | grep -oE 'system-images;[^ |]+' | sort -u || true
            exit 1
          fi

          api="$(echo "$image" | cut -d';' -f2 | sed 's/android-//')"

          echo "Using system image: $image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "EMULATOR_API=$api" >> "$GITHUB_ENV"

          echo "no" | sdkmanager "$image"
          echo "no" | avdmanager create avd --name cqb --package "$image" --device pixel_6 --force

          avdmanager list avd

      - name: Report what the emulator can do
        run: |
          # Facts before the attempt, so a failure below is diagnosable rather than mysterious.
          "$ANDROID_HOME/emulator/emulator" -accel-check || true
          avdmanager list avd || true

          # The emulator's own view, which is the one that matters: it resolves the AVD directory
          # differently from avdmanager.
          "$ANDROID_HOME/emulator/emulator" -list-avds

          adb start-server
          adb version

      - name: Boot the emulator
        run: |
          # `swiftshader_indirect` is software rendering, which is what a headless runner can do.
          # `-no-snapshot` makes every run a cold boot, so the result does not depend on a saved state.
          "$ANDROID_HOME/emulator/emulator" \
            -avd cqb \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -accel on \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &

          emulator_pid=$!

          # Nothing here waits forever. `adb wait-for-device` does, and a step that hangs until the
          # job times out tells a reader nothing about why.
          appear_deadline=$(( SECONDS + 420 ))
          echo "Waiting for the emulator to appear (pid $emulator_pid)..."

          until adb devices | grep -qE '^emulator-[0-9]+[[:space:]]+device$'; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "::error::The emulator process exited before it appeared."
              echo "--- emulator.log ---"
              tail -80 "$RUNNER_TEMP/emulator.log" || true
              exit 1
            fi

            if [ "$SECONDS" -ge "$appear_deadline" ]; then
              echo "::error::The emulator did not appear within ${appear_deadline}s."
              echo "--- emulator.log ---"
              tail -80 "$RUNNER_TEMP/emulator.log" || true
              exit 1
            fi

            sleep 5
          done

          echo "The emulator is visible to adb:"
          adb devices

          boot_deadline=$(( SECONDS + 900 ))
          echo "Waiting for sys.boot_completed..."

          # Every adb call is bounded. `adb shell` blocks indefinitely while the device is still
          # coming up, and a loop that cannot reach its own deadline check is not a deadline.
          until [ "$(timeout 20 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" = "1" ]; do
            if [ "$SECONDS" -ge "$boot_deadline" ]; then
              echo "::error::The emulator did not finish booting within 900s."
              echo "--- emulator.log ---"
              tail -80 "$RUNNER_TEMP/emulator.log" || true
              exit 1
            fi

            echo "  ... still booting (${SECONDS}s elapsed)"
            sleep 5
          done

          echo "sys.boot_completed=1"

          # Give the package manager a moment after boot_completed, which is what the first install
          # actually waits on.
          timeout 60 adb shell 'while [ "$(getprop init.svc.bootanim)" != "stopped" ]; do sleep 1; done' || true
          sleep 10

          timeout 30 adb shell input keyevent 82 || true
          adb devices
          timeout 30 adb shell getprop ro.build.version.sdk

      - name: Disable animations
        run: |
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Run the instrumentation tests
        working-directory: src/android
        run: |
          chmod +x ./gradlew

          # The complete Stage C and Stage D gate, in one place, on a real Android runtime.
          ./gradlew --no-daemon \
            testDebugUnitTest \
            lintDebug \
            connectedDebugAndroidTest \
            assembleDebug

      - name: Publish the instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-reports
          if-no-files-found: ignore
          path: |
            src/android/app/build/outputs/androidTest-results/**
            src/android/app/build/reports/androidTests/**
            src/android/app/build/reports/lint-results-debug.*
            src/android/app/build/test-results/**
            src/android/app/build/outputs/apk/**

      - name: Stop the emulator
        if: always()
        run: |
          adb emu kill || true
          pkill -f qemu-system || true

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Android runtime gates"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| System image | ${{ steps.image.outputs.image }} |"
            echo "| Emulator API | ${{ steps.image.outputs.api }} |"
          } >> "$GITHUB_STEP_SUMMARY"
